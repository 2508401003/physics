<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>引力迷宫 - 物理探索游戏</title>
<style>
:root {
  --bg: #06081a; --panel: #0d1030; --border: #1e2260;
  --text: #d0d8f0; --muted: #7a80b0; --cyan: #00e5ff;
  --gold: #ffd740; --red: #ff5252; --green: #69f0ae;
  --purple: #b388ff; --radius: 12px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; overflow-x: hidden;
}
.game-wrap {
  display: flex; gap: 14px; padding: 14px;
  max-width: 1060px; width: 100%; align-items: flex-start;
}
.canvas-box {
  flex:1 1 auto; min-width:280px; background:var(--panel);
  border-radius:var(--radius); border:2px solid var(--border);
  overflow:hidden; box-shadow:0 8px 40px rgba(0,0,0,.5);
}
canvas { display:block; width:100%; height:auto; cursor:crosshair; }

.side { flex:0 0 265px; display:flex; flex-direction:column; gap:10px; }
.card {
  background:var(--panel); border:1px solid var(--border);
  border-radius:var(--radius); padding:13px 15px; box-shadow:0 4px 20px rgba(0,0,0,.4);
}
.card h3 {
  font-size:12px; text-transform:uppercase; letter-spacing:.08em;
  color:var(--cyan); margin-bottom:8px; padding-bottom:6px;
  border-bottom:1px solid var(--border); font-weight:600;
}
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:4px; }
.spread { display:flex; justify-content:space-between; align-items:center; font-size:13px; margin-bottom:2px; }
.lvl { background:var(--cyan); color:#000; padding:2px 10px; border-radius:20px; font-weight:700; font-size:12px; }
.star { font-size:18px; letter-spacing:2px; }
.fuel-bar { height:6px; background:var(--border); border-radius:3px; margin:4px 0; overflow:hidden; }
.fuel-fill { height:100%; background:linear-gradient(90deg, var(--green), var(--cyan)); border-radius:3px; transition: width .3s; }
.btn {
  flex:1; min-width:55px; padding:9px 12px; border:none; border-radius:8px;
  font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; letter-spacing:.03em;
}
.btn:active { transform:scale(.95); }
.btn-go {
  background:linear-gradient(135deg,var(--cyan),#0091ea); color:#000; font-size:14px;
  padding:11px; box-shadow:0 4px 15px rgba(0,229,255,.35);
}
.btn-go:hover { box-shadow:0 6px 24px rgba(0,229,255,.55); }
.btn-go:disabled { opacity:.35; cursor:not-allowed; box-shadow:none; }
.btn-r { background:var(--border); color:var(--text); }
.btn-r:hover { background:#2a2e70; }
.btn-m { background:transparent; border:1px solid var(--cyan); color:var(--cyan); font-size:11px; }
.btn-m:hover { background:rgba(0,229,255,.1); }
.btn-m.on { background:var(--cyan); color:#000; }
.pgrid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
.pi { background:rgba(255,255,255,.025); border-radius:6px; padding:6px 8px; text-align:center; }
.pi .v { font-size:15px; font-weight:700; color:var(--cyan); font-family:'SF Mono',Consolas,monospace; }
.pi .l { font-size:10px; color:var(--muted); }
.tip { font-size:11px; color:var(--muted); text-align:center; line-height:1.5; }
.formula { font-family:'SF Mono',Consolas,monospace; font-size:10px; color:var(--purple);
  background:rgba(179,136,255,.08); padding:5px 7px; border-radius:4px; text-align:center;
  word-break:break-all; margin-top:4px; }
.toast {
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  background:var(--panel); border:1px solid var(--cyan); color:var(--text);
  padding:10px 22px; border-radius:30px; font-weight:600; font-size:13px;
  z-index:100; pointer-events:none; opacity:0; transition:opacity .3s;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.toast.on { opacity:1; }
@media (max-width:780px) {
  .game-wrap { flex-direction:column; padding:6px; gap:6px; }
  .side { flex:0 0 auto; flex-direction:row; flex-wrap:wrap; }
  .side .card { flex:1 1 44%; min-width:140px; padding:8px; }
}
</style>
</head>
<body>

<div class="game-wrap">
  <div class="canvas-box"><canvas id="gc"></canvas></div>
  <div class="side">
    <div class="card">
      <div class="spread"><span class="lvl" id="lvlBadge">第1关</span><span class="star" id="starDisp">☆☆☆</span></div>
      <div class="spread"><span style="color:var(--muted);">剩余燃料</span><span id="fuelTxt" style="font-weight:700;">100%</span></div>
      <div class="fuel-bar"><div class="fuel-fill" id="fuelFill" style="width:100%;"></div></div>
      <div class="spread"><span style="color:var(--muted);">尝试次数</span><span id="tryTxt" style="font-weight:700;">0</span></div>
    </div>

    <div class="card">
      <h3>🎮 操作</h3>
      <button class="btn btn-go" id="btnThrust" style="width:100%;">🚀 推进</button>
      <div class="row">
        <button class="btn btn-r" id="btnReset">↺ 重置</button>
        <button class="btn btn-m" id="btnPause">⏯ 暂停</button>
      </div>
      <div class="tip" id="tipTxt">💡 <b>从飞船拖拽</b>设定推力方向<br>松开即推进，空格键暂停</div>
    </div>

    <div class="card">
      <h3>📐 实时物理量</h3>
      <div class="pgrid">
        <div class="pi"><div class="v" id="pvV">--</div><div class="l">速率 (px/s)</div></div>
        <div class="pi"><div class="v" id="pvFg">--</div><div class="l">引力 (px/s²)</div></div>
        <div class="pi"><div class="v" id="pvEk">--</div><div class="l">动能 (a.u.)</div></div>
        <div class="pi"><div class="v" id="pvEp">--</div><div class="l">势能 (a.u.)</div></div>
      </div>
      <div class="formula" id="formulaDisp">F = G·M/r² &nbsp;|&nbsp; E = ½mv² − GM/r</div>
    </div>

    <div class="card">
      <div class="row" style="margin-top:0;">
        <button class="btn btn-m on" id="btnTeach">📖 教学</button>
        <button class="btn btn-m" id="btnChall">🏆 挑战</button>
      </div>
      <div class="row">
        <button class="btn btn-r" id="btnPrev" disabled>◀</button>
        <span style="font-size:12px;color:var(--muted);flex:1;text-align:center;" id="lvlName">初入引力场</span>
        <button class="btn btn-r" id="btnNext">▶</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

// ============================================================
//  引力迷宫 Gravity Labyrinth
//  多引力源轨道力学 + 动量碰撞 + 能量管理
// ============================================================

// ============ 常量 ============
var GRAV   = 800;
var MAX_SIM_T = 45;

// ============ 全局引用 ============
var canvas, ctx, cw, ch;

// ============ 状态 ============
var mode    = 'teach';       // 'teach' | 'challenge'
var lvlIdx  = 0;
var stars   = {};            // { idx: 1|2|3 }
var tries   = 0;
var ship    = null;          // { x,y, vx,vy, trail:[] }
var fuel    = 0;
var fuelMax = 0;
var flying  = false;
var paused  = false;
var won     = false;
var dead    = false;
var simT    = 0;
var dragging = false;
var dragX   = 0;
var dragY   = 0;
var predictPts = [];
var parts   = [];
var shakeAmt = 0;
var shakeDur = 0;
var starField = [];

// ============ 关卡定义 (坐标: 画布像素, y轴向下) ============
var LEVELS = [
  { name:'初入引力场', desc:'单引力源 — 学习在引力场中导航',
    tip:'从飞船拖拽设定推力，注意引力会弯曲轨迹！',
    formula:'引力: F = GM/r²　方向指向引力源',
    ship:[80,280], portal:[620,100], wells:[{x:350,y:220,M:1200,R:18}], walls:[], roids:[],
    fuel:100 },
  { name:'引力弹弓', desc:'双引力源 — 利用引力弹弓效应加速',
    tip:'从大质量天体附近掠过可以借助引力加速！',
    formula:'引力弹弓: Δv ≈ 2u（u=天体轨道速度）',
    ship:[60,200], portal:[680,380],
    wells:[{x:280,y:200,M:1800,R:22},{x:500,y:350,M:900,R:15}], walls:[], roids:[],
    fuel:100 },
  { name:'小行星带', desc:'穿越障碍 — 在小行星之间精确导航',
    tip:'小行星会摧毁飞船！规划路线避开它们',
    formula:'动量: p = mv　精确规划轨迹',
    ship:[50,280], portal:[700,100], wells:[{x:380,y:220,M:1500,R:20}], walls:[],
    roids:[{x:200,y:140,R:18},{x:250,y:300,R:14},{x:420,y:80,R:22},{x:480,y:350,R:16},{x:550,y:180,R:20},{x:580,y:280,R:12}],
    fuel:120 },
  { name:'三星系统', desc:'三引力源 — 复杂引力场的轨道力学',
    tip:'三个引力源的矢量叠加产生复杂场',
    formula:'合力: F = Σ G·Mᵢ/rᵢ² (矢量叠加)',
    ship:[60,160], portal:[690,400],
    wells:[{x:300,y:160,M:1400,R:20},{x:480,y:340,M:1000,R:16},{x:200,y:380,M:800,R:14}], walls:[], roids:[],
    fuel:130 },
  { name:'迷宫引力阱', desc:'终极挑战 — 墙壁迷宫 + 双引力源',
    tip:'墙壁会反弹飞船但消耗动能，节约燃料！',
    formula:'弹性碰撞: v\' = v − 2(v·n)n',
    ship:[45,300], portal:[710,60],
    wells:[{x:350,y:220,M:1600,R:22},{x:550,y:120,M:1000,R:16}],
    walls:[{x:180,y:80,w:15,h:180},{x:300,y:240,w:200,h:15},{x:460,y:60,w:15,h:220},{x:580,y:340,w:120,h:15}],
    roids:[], fuel:150 },
];

// ============ 辅助函数 ============
function $(id){ return document.getElementById(id); }
function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }

// ============ 音效 ============
var actx = null;
function snd(type){ try{
  if(!actx){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; actx=new AC(); }
  var a=actx, o=a.createOscillator(), g=a.createGain();
  o.connect(g); g.connect(a.destination); var t=a.currentTime;
  if(type==='thrust'){ o.type='sawtooth'; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(60,t+.15); g.gain.setValueAtTime(.1,t); g.gain.exponentialRampToValueAtTime(.001,t+.15); o.start(t); o.stop(t+.15); }
  else if(type==='hit'){ o.type='sine'; o.frequency.setValueAtTime(500,t); o.frequency.exponentialRampToValueAtTime(1200,t+.08); g.gain.setValueAtTime(.18,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); o.start(t); o.stop(t+.25); }
  else if(type==='bounce'){ o.type='triangle'; o.frequency.setValueAtTime(350,t); o.frequency.exponentialRampToValueAtTime(150,t+.1); g.gain.setValueAtTime(.08,t); g.gain.exponentialRampToValueAtTime(.001,t+.15); o.start(t); o.stop(t+.15); }
  else if(type==='win'){ [523,659,784,1047].forEach(function(f,i){ var oo=a.createOscillator(),gg=a.createGain(); oo.connect(gg); gg.connect(a.destination); oo.type='sine'; oo.frequency.setValueAtTime(f,t+i*.1); gg.gain.setValueAtTime(.12,t+i*.1); gg.gain.exponentialRampToValueAtTime(.001,t+i*.1+.25); oo.start(t+i*.1); oo.stop(t+i*.1+.25); }); }
  else if(type==='fail'){ o.type='sine'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(50,t+.35); g.gain.setValueAtTime(.1,t); g.gain.exponentialRampToValueAtTime(.001,t+.4); o.start(t); o.stop(t+.4); }
}catch(e){} }

// ============ Toast ============
var toT;
function toast(m,d){ d=d||2200; var e=$('toast'); e.textContent=m; e.classList.add('on'); clearTimeout(toT); toT=setTimeout(function(){e.classList.remove('on');},d); }

// ============ 粒子 ============
function Part(x,y,vx,vy,c,life,sz){
  this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.c=c; this.life=life; this.ml=life; this.sz=sz||2;
}
Part.prototype.up=function(dt){ this.x+=this.vx*dt; this.y+=this.vy*dt; this.life-=dt; };
Part.prototype.a=function(){ return Math.max(0,this.life/this.ml); };

function spawnParts(x,y,ok){
  var n=ok?35:10;
  var cs=ok?['#00e5ff','#69f0ae','#ffffff','#b388ff','#ffd740']:['#ff5252','#ff8a80','#888'];
  for(var i=0;i<n;i++){
    var ang=Math.random()*Math.PI*2;
    var sp=1+Math.random()*(ok?7:3);
    parts.push(new Part(x,y,Math.cos(ang)*sp,Math.sin(ang)*sp,cs[Math.floor(Math.random()*cs.length)],.3+Math.random()*.7,1+Math.random()*(ok?4:2)));
  }
  shakeAmt=ok?5:2; shakeDur=.25;
}

// ============ 物理: 某点的总引力加速度 ============
function gravAt(x,y,wells){
  var ax=0, ay=0;
  for(var i=0;i<wells.length;i++){
    var w=wells[i];
    var dx=w.x-x, dy=w.y-y;
    var r2=dx*dx+dy*dy;
    var r=Math.sqrt(r2);
    if(r<w.R*.3) continue;
    var a=GRAV*w.M/r2;
    ax+=a*dx/r; ay+=a*dy/r;
  }
  return {ax:ax, ay:ay, mag:Math.sqrt(ax*ax+ay*ay)};
}

// ============ 碰撞检测 ============
function checkWalls(x,y,walls){
  for(var i=0;i<walls.length;i++){
    var w=walls[i];
    if(x>=w.x-4 && x<=w.x+w.w+4 && y>=w.y-4 && y<=w.y+w.h+4){
      var cx=clamp(x,w.x,w.x+w.w);
      var cy=clamp(y,w.y,w.y+w.h);
      var dx=x-cx, dy=y-cy;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<6){ return {hit:true, nx:(dx/dist)||0, ny:(dy/dist)||0, cx:cx, cy:cy}; }
    }
  }
  return {hit:false};
}
function checkRoids(x,y,roids){
  for(var i=0;i<roids.length;i++){
    var r=roids[i];
    var dx=x-r.x, dy=y-r.y;
    if(Math.sqrt(dx*dx+dy*dy) < r.R+5) return true;
  }
  return false;
}
function checkPortal(x,y,px,py){
  var dx=x-px, dy=y-py;
  return Math.sqrt(dx*dx+dy*dy) < 22;
}

// ============ 轨迹预测 ============
function predictPath(vx0,vy0,sx,sy,lvl,maxSteps){
  maxSteps=maxSteps||300;
  var pts=[];
  var x=sx, y=sy, vx=vx0, vy=vy0;
  var dt=.03;
  for(var i=0;i<maxSteps;i++){
    pts.push({x:x,y:y});
    var g=gravAt(x,y,lvl.wells);
    vx+=g.ax*dt; vy+=g.ay*dt;
    x+=vx*dt; y+=vy*dt;
    if(x<-60||x>cw+60||y<-60||y>ch+60) break;
    var wc=checkWalls(x,y,lvl.walls);
    if(wc.hit){
      var dot=vx*wc.nx+vy*wc.ny;
      if(dot<0){ vx-=2*dot*wc.nx; vy-=2*dot*wc.ny; vx*=.6; vy*=.6; x=wc.cx+wc.nx*8; y=wc.cy+wc.ny*8; pts.push({x:x,y:y}); }
    }
    if(checkRoids(x,y,lvl.roids)){ pts.push({x:x,y:y}); break; }
    var tooClose=false;
    for(var j=0;j<lvl.wells.length;j++){
      var w=lvl.wells[j];
      if(Math.sqrt((x-w.x)*(x-w.x)+(y-w.y)*(y-w.y)) < w.R*.4){ tooClose=true; break; }
    }
    if(tooClose) break;
  }
  return pts;
}

// ============ 推进 ============
function doThrust(){
  if(!ship||won||dead) return;
  if(!dragging && dragX===0 && dragY===0){
    // 如果从未拖拽过，提示用户先拖拽
    toast('👆 请先在画布上从飞船位置拖拽来设定推力！',2500);
    return;
  }

  var lvl=LEVELS[lvlIdx];
  var dx=dragX-ship.x, dy=dragY-ship.y;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<3) return;

  var power=Math.min(dist*.6,280);
  var ux=dx/dist, uy=dy/dist;

  // 消耗燃料
  var fuelCost=power*.15;
  if(mode==='challenge'&&fuel<fuelCost){ toast('⛽ 燃料不足！'); return; }
  fuel=Math.max(0,fuel-fuelCost);

  // 应用推力
  ship.vx+=ux*power; ship.vy+=uy*power;
  flying=true; paused=false; tries++;

  // 推力粒子
  for(var i=0;i<15;i++){
    var ang=Math.atan2(-uy,-ux)+Math.random()*.6-.3;
    var sp=40+Math.random()*80;
    parts.push(new Part(ship.x,ship.y,Math.cos(ang)*sp,Math.sin(ang)*sp,'#00e5ff',.15+Math.random()*.2,1.5+Math.random()*2));
  }
  snd('thrust');

  dragging=false; dragX=0; dragY=0;
  predictPts=[];
  $('btnThrust').disabled=true;
  $('btnPause').classList.remove('on');
  updateUI();
}

// ============ 重置关卡 ============
function resetLevel(){
  var lvl=LEVELS[lvlIdx];
  ship={ x:lvl.ship[0], y:lvl.ship[1], vx:0, vy:0, trail:[] };
  fuel=lvl.fuel; fuelMax=lvl.fuel;
  flying=false; paused=false; won=false; dead=false; simT=0;
  tries=0; parts=[]; predictPts=[]; dragging=false; dragX=0; dragY=0; shakeAmt=0; shakeDur=0;
  $('btnThrust').disabled=false;
  $('btnPause').classList.remove('on');
  updateUI();
}

// ============ UI更新 ============
function updateUI(){
  var lvl=LEVELS[lvlIdx];
  $('lvlBadge').textContent='第'+(lvlIdx+1)+'关';
  $('lvlName').textContent=lvl.name;
  $('fuelTxt').textContent=Math.round(fuel)+' / '+fuelMax;
  $('fuelFill').style.width=(fuel/fuelMax*100)+'%';
  $('tryTxt').textContent=tries;
  var s=stars[lvlIdx]||0;
  $('starDisp').textContent=Array(s+1).join('★')+Array(4-s).join('☆');
  $('tipTxt').innerHTML='💡 '+lvl.tip;
  $('formulaDisp').textContent=lvl.formula;
  $('btnPrev').disabled=(lvlIdx===0);
  $('btnNext').disabled=(lvlIdx>=LEVELS.length-1);
  $('btnTeach').classList.toggle('on',mode==='teach');
  $('btnChall').classList.toggle('on',mode==='challenge');
}

function updatePhys(){
  function sv(id,v,d){
    var e=$(id); if(!e) return;
    d=d||1;
    if(typeof v==='number'&&isFinite(v)){ e.textContent=v.toFixed(d); }
    else { e.textContent='--'; }
  }
  if(ship){
    var v=Math.sqrt(ship.vx*ship.vx+ship.vy*ship.vy);
    var g=gravAt(ship.x,ship.y,LEVELS[lvlIdx].wells);
    var ek=.5*v*v;
    var ep=0;
    var wells=LEVELS[lvlIdx].wells;
    for(var i=0;i<wells.length;i++){
      var w=wells[i];
      var r=Math.sqrt((ship.x-w.x)*(ship.x-w.x)+(ship.y-w.y)*(ship.y-w.y));
      if(r>w.R*.3) ep-=GRAV*w.M/r;
    }
    sv('pvV',v); sv('pvFg',g.mag); sv('pvEk',ek/1000,2); sv('pvEp',ep/100000,2);
  } else {
    $('pvV').textContent='--'; $('pvFg').textContent='--';
    $('pvEk').textContent='--'; $('pvEp').textContent='--';
  }
}

// ============ 渲染 ============
function initStars(){
  starField=[];
  for(var i=0;i<180;i++){
    starField.push({ x:Math.random()*cw, y:Math.random()*ch, r:.4+Math.random()*1.6, b:.3+Math.random()*.7, tw:Math.random()*Math.PI*2 });
  }
}

function drawBG(t){
  var grad=ctx.createRadialGradient(cw/2,ch/2,0,cw/2,ch/2,Math.max(cw,ch)*.7);
  grad.addColorStop(0,'#0a1040'); grad.addColorStop(1,'#030618');
  ctx.fillStyle=grad; ctx.fillRect(0,0,cw,ch);

  for(var i=0;i<starField.length;i++){
    var s=starField[i];
    var flicker=1+.15*Math.sin(t*3+s.tw);
    ctx.fillStyle='rgba(255,255,255,'+(s.b*flicker)+')';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
}

function drawWell(w){
  for(var i=6;i>=0;i--){
    var r=w.R*(1+i*.6);
    var alpha=.04+.02*i;
    var grad=ctx.createRadialGradient(w.x,w.y,w.R*.3,w.x,w.y,r);
    grad.addColorStop(0,'rgba(140,120,255,'+(alpha+.15)+')');
    grad.addColorStop(.5,'rgba(100,60,220,'+alpha+')');
    grad.addColorStop(1,'rgba(60,20,180,0)');
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(w.x,w.y,r,0,Math.PI*2); ctx.fill();
  }
  var core=ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,w.R);
  core.addColorStop(0,'rgba(200,180,255,.9)');
  core.addColorStop(.5,'rgba(120,80,220,.5)');
  core.addColorStop(1,'rgba(60,20,180,0)');
  ctx.fillStyle=core; ctx.beginPath(); ctx.arc(w.x,w.y,w.R,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(200,180,255,.7)';
  ctx.font='10px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.fillText('M='+(w.M/100).toFixed(0),w.x,w.y-w.R-6);
}

function drawGravityField(wells){
  var step=38;
  ctx.strokeStyle='rgba(140,120,255,.15)';
  ctx.lineWidth=.8;
  for(var x=step;x<cw;x+=step){
    for(var y=step;y<ch;y+=step){
      var g=gravAt(x,y,wells);
      if(g.mag<2) continue;
      var len=Math.min(g.mag*.3,12);
      var ang=Math.atan2(g.ay,g.ax);
      ctx.beginPath(); ctx.moveTo(x,y);
      ctx.lineTo(x+Math.cos(ang)*len,y+Math.sin(ang)*len); ctx.stroke();
      var hx=x+Math.cos(ang)*len, hy=y+Math.sin(ang)*len;
      ctx.beginPath(); ctx.moveTo(hx,hy);
      ctx.lineTo(hx-Math.cos(ang-.7)*4,hy-Math.sin(ang-.7)*4);
      ctx.lineTo(hx-Math.cos(ang+.7)*4,hy-Math.sin(ang+.7)*4);
      ctx.closePath(); ctx.fillStyle='rgba(140,120,255,.15)'; ctx.fill();
    }
  }
}

function drawWalls(walls){
  for(var i=0;i<walls.length;i++){
    var w=walls[i];
    ctx.strokeStyle='rgba(255,100,80,.5)'; ctx.lineWidth=3;
    ctx.strokeRect(w.x-2,w.y-2,w.w+4,w.h+4);
    var g=ctx.createLinearGradient(w.x,w.y,w.x+w.w,w.y+w.h);
    g.addColorStop(0,'#3a1520'); g.addColorStop(1,'#2a1020');
    ctx.fillStyle=g; ctx.fillRect(w.x,w.y,w.w,w.h);
    ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
    ctx.strokeRect(w.x+3,w.y+3,w.w-6,w.h-6);
  }
}

function drawRoids(roids){
  for(var i=0;i<roids.length;i++){
    var r=roids[i];
    var g=ctx.createRadialGradient(r.x-2,r.y-2,r.R*.2,r.x,r.y,r.R);
    g.addColorStop(0,'#888'); g.addColorStop(1,'#333');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(r.x,r.y,r.R,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1.5; ctx.stroke();
  }
}

function drawPortal(px,py,t){
  var pulse=1+.15*Math.sin(t*3);
  var og=ctx.createRadialGradient(px,py,6,px,py,30*pulse);
  og.addColorStop(0,'rgba(100,255,180,.6)');
  og.addColorStop(.5,'rgba(0,229,150,.15)');
  og.addColorStop(1,'rgba(0,200,100,0)');
  ctx.fillStyle=og; ctx.beginPath(); ctx.arc(px,py,30*pulse,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(100,255,180,.7)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(px,py,14,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(px,py,18,0,Math.PI*2); ctx.stroke();
  for(var i=0;i<6;i++){
    var a=t*2+i*Math.PI/3;
    ctx.fillStyle='rgba(100,255,180,.8)';
    ctx.beginPath(); ctx.arc(px+Math.cos(a)*12,py+Math.sin(a)*12,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.fillText('🏁 出口',px,py-26);
}

function drawShip(){
  if(!ship) return;
  var sx=ship.x, sy=ship.y;
  // 轨迹
  if(ship.trail.length>2){
    ctx.strokeStyle='rgba(0,229,255,.3)'; ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath();
    for(var i=0;i<ship.trail.length;i++){
      var t=ship.trail[i];
      if(i===0) ctx.moveTo(t.x,t.y); else ctx.lineTo(t.x,t.y);
    }
    ctx.stroke();
  }
  // 光晕
  var glow=ctx.createRadialGradient(sx,sy,3,sx,sy,16);
  glow.addColorStop(0,'rgba(0,229,255,.7)'); glow.addColorStop(1,'rgba(0,229,255,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(sx,sy,16,0,Math.PI*2); ctx.fill();
  // 三角形船体
  var ang=-Math.PI/2;
  if(Math.abs(ship.vx)>1e-3||Math.abs(ship.vy)>1e-3) ang=Math.atan2(ship.vy,ship.vx);
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(ang);
  ctx.fillStyle='#e0f0ff'; ctx.beginPath();
  ctx.moveTo(10,0); ctx.lineTo(-7,-5); ctx.lineTo(-5,0); ctx.lineTo(-7,5); ctx.closePath();
  ctx.fill(); ctx.strokeStyle='#00e5ff'; ctx.lineWidth=1.5; ctx.stroke();
  if(flying){
    ctx.fillStyle='rgba(0,229,255,.6)';
    ctx.beginPath(); ctx.arc(-6,0,3+Math.random()*2,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawPredict(){
  if(!predictPts.length) return;
  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1.5;
  ctx.setLineDash([5,5]); ctx.lineCap='round';
  ctx.beginPath();
  for(var i=0;i<predictPts.length;i++){
    var p=predictPts[i];
    if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
  }
  ctx.stroke(); ctx.setLineDash([]);
}

function drawParts(){
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    ctx.fillStyle=p.c; ctx.globalAlpha=p.a();
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz*p.a(),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  var st=flying?'飞行中...':(paused?'⏸ 已暂停':'🎯 拖拽飞船设定推力');
  ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.font='13px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.fillText(st,cw/2,22);

  if(mode==='challenge'){
    var bw=120, bh=8, bx=cw-bw-14, by=12;
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(bx-2,by-2,bw+4,bh+4);
    ctx.fillStyle='#1a1a3a'; ctx.fillRect(bx,by,bw,bh);
    var frac=fuel/fuelMax;
    var fg=ctx.createLinearGradient(bx,0,bx+bw,0);
    fg.addColorStop(0,'#69f0ae'); fg.addColorStop(1,'#00e5ff');
    ctx.fillStyle=fg; ctx.fillRect(bx,by,bw*frac,bh);
    ctx.fillStyle='#fff'; ctx.font='9px "SF Mono",Consolas,monospace'; ctx.textAlign='right';
    ctx.fillText('燃料 '+Math.round(fuel),bx-4,by+8);
  }
}

function render(ts){
  ctx.clearRect(0,0,cw,ch);
  var sx=0, sy=0;
  if(shakeDur>0){ sx=(Math.random()-.5)*shakeAmt*2; sy=(Math.random()-.5)*shakeAmt*2; }
  ctx.save(); ctx.translate(sx,sy);

  var lvl=LEVELS[lvlIdx];
  drawBG(ts);
  drawGravityField(lvl.wells);
  for(var i=0;i<lvl.wells.length;i++) drawWell(lvl.wells[i]);
  drawWalls(lvl.walls);
  drawRoids(lvl.roids);
  drawPortal(lvl.portal[0],lvl.portal[1],ts*.001);
  drawPredict();
  drawShip();
  drawParts();
  drawHUD();

  ctx.restore();
}

// ============ 游戏逻辑 ============
function update(dt){
  // 震动衰减
  if(shakeDur>0){ shakeDur-=dt; shakeAmt*=.88; if(shakeDur<=0){shakeAmt=0;shakeDur=0;} }

  // 粒子
  for(var i=0;i<parts.length;i++) parts[i].up(dt);
  parts=parts.filter(function(p){ return p.life>0; });

  if(!flying||paused||won||dead) return;

  var lvl=LEVELS[lvlIdx];
  var subSteps=3;
  var sdt=dt/subSteps;

  for(var ss=0;ss<subSteps;ss++){
    if(!flying||won||dead) break;
    simT+=sdt;
    if(simT>MAX_SIM_T){ dead=true; toast('⏰ 时间耗尽！飞船飘入深空...'); snd('fail'); break; }

    // 引力
    var g=gravAt(ship.x,ship.y,lvl.wells);
    ship.vx+=g.ax*sdt; ship.vy+=g.ay*sdt;
    ship.x+=ship.vx*sdt; ship.y+=ship.vy*sdt;

    // 轨迹记录
    if(ship.trail.length===0||simT-(ship.trail[ship.trail.length-1]&&ship.trail[ship.trail.length-1].t||0)>.03){
      ship.trail.push({x:ship.x,y:ship.y,t:simT});
      if(ship.trail.length>120) ship.trail.shift();
    }

    // 边界
    if(ship.x<-60||ship.x>cw+60||ship.y<-60||ship.y>ch+60){ dead=true; toast('💫 飞船离开导航范围！'); snd('fail'); break; }

    // 撞墙
    var wc=checkWalls(ship.x,ship.y,lvl.walls);
    if(wc.hit){
      var dot=ship.vx*wc.nx+ship.vy*wc.ny;
      if(dot<0){ ship.vx-=2*dot*wc.nx; ship.vy-=2*dot*wc.ny; ship.vx*=.55; ship.vy*=.55; ship.x=wc.cx+wc.nx*8; ship.y=wc.cy+wc.ny*8; snd('bounce'); spawnParts(ship.x,ship.y,false); }
    }

    // 撞小行星
    if(checkRoids(ship.x,ship.y,lvl.roids)){ dead=true; toast('☄️ 撞上小行星！飞船损毁'); snd('fail'); spawnParts(ship.x,ship.y,false); break; }

    // 引力源吞噬
    var swallowed=false;
    for(var j=0;j<lvl.wells.length;j++){
      var w=lvl.wells[j];
      var d=Math.sqrt((ship.x-w.x)*(ship.x-w.x)+(ship.y-w.y)*(ship.y-w.y));
      if(d<w.R*.35){ dead=true; toast('🕳 被引力源捕获！'); snd('fail'); spawnParts(ship.x,ship.y,false); swallowed=true; break; }
    }
    if(swallowed) break;

    // 到达出口
    if(checkPortal(ship.x,ship.y,lvl.portal[0],lvl.portal[1])){
      won=true; flying=false;
      var fuelPct=fuel/fuelMax;
      var starCount=1;
      if(fuelPct>.7) starCount=3; else if(fuelPct>.4) starCount=2;
      stars[lvlIdx]=Math.max(stars[lvlIdx]||0,starCount);
      var starStr=''; for(var k=0;k<starCount;k++) starStr+='⭐';
      toast(starStr+' 到达出口！(剩余燃料 '+Math.round(fuel)+')',3000);
      snd('win'); spawnParts(ship.x,ship.y,true);
      $('btnNext').disabled=(lvlIdx>=LEVELS.length-1);
      break;
    }

    // 速度过低自动暂停 (教学模式)
    var v=Math.sqrt(ship.vx*ship.vx+ship.vy*ship.vy);
    if(mode==='teach'&&v<1.5&&flying&&simT>1){
      paused=true; flying=false;
      $('btnPause').classList.add('on');
      toast('⏸ 飞船近乎停止 — 请设定下一次推进',2000);
      $('btnThrust').disabled=false;
      break;
    }
  }

  updatePhys();
  if(dead) $('btnThrust').disabled=true;
}

// ============ 输入处理 ============
function setupInput(){
  $('btnThrust').addEventListener('click',doThrust);
  $('btnReset').addEventListener('click',resetLevel);
  $('btnPause').addEventListener('click',function(){
    if(won||dead) return;
    if(flying){ paused=!paused; $('btnPause').classList.toggle('on',paused); }
    else if(paused){ paused=false; flying=true; $('btnPause').classList.remove('on'); $('btnThrust').disabled=true; }
    if(!flying&&!paused) $('btnThrust').disabled=false;
  });
  $('btnTeach').addEventListener('click',function(){ mode='teach'; resetLevel(); toast('📖 教学模式',1500); });
  $('btnChall').addEventListener('click',function(){ mode='challenge'; resetLevel(); toast('🏆 挑战模式',1500); });
  $('btnPrev').addEventListener('click',function(){ if(lvlIdx>0){ lvlIdx--; resetLevel(); toast('◀ '+LEVELS[lvlIdx].name,1500); } });
  $('btnNext').addEventListener('click',function(){ if(lvlIdx<LEVELS.length-1){ lvlIdx++; resetLevel(); toast('▶ '+LEVELS[lvlIdx].name,1500); } });

  // 画布拖拽
  canvas.addEventListener('mousedown',function(e){
    if(won||dead) return;
    var r=canvas.getBoundingClientRect();
    var sx=(e.clientX-r.left)*(cw/r.width);
    var sy=(e.clientY-r.top)*(ch/r.height);
    if(!ship) return;
    var dist=Math.sqrt((sx-ship.x)*(sx-ship.x)+(sy-ship.y)*(sy-ship.y));
    if(dist<80||!flying){
      dragging=true; dragX=sx; dragY=sy;
      canvas.style.cursor='grabbing';
    }
  });
  canvas.addEventListener('mousemove',function(e){
    if(!dragging||!ship) return;
    var r=canvas.getBoundingClientRect();
    dragX=(e.clientX-r.left)*(cw/r.width);
    dragY=(e.clientY-r.top)*(ch/r.height);
    var dx=dragX-ship.x, dy=dragY-ship.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>3){
      var power=Math.min(dist*.6,280);
      var ux=dx/dist, uy=dy/dist;
      var lvl=LEVELS[lvlIdx];
      predictPts=predictPath(ship.vx+ux*power,ship.vy+uy*power,ship.x,ship.y,lvl,250);
    }
  });
  canvas.addEventListener('mouseup',function(e){
    if(!dragging) return;
    dragging=false; canvas.style.cursor='crosshair';
    var r=canvas.getBoundingClientRect();
    dragX=(e.clientX-r.left)*(cw/r.width);
    dragY=(e.clientY-r.top)*(ch/r.height);
    if(ship){
      var dx=dragX-ship.x, dy=dragY-ship.y;
      if(Math.sqrt(dx*dx+dy*dy)>8){ doThrust(); }
      else { predictPts=[]; dragX=0; dragY=0; }
    }
  });
  canvas.addEventListener('mouseleave',function(){ dragging=false; canvas.style.cursor='crosshair'; predictPts=[]; });

  // 触摸
  canvas.addEventListener('touchstart',function(e){
    if(won||dead) return; e.preventDefault();
    var r=canvas.getBoundingClientRect();
    dragX=(e.touches[0].clientX-r.left)*(cw/r.width);
    dragY=(e.touches[0].clientY-r.top)*(ch/r.height);
    dragging=true;
  },{passive:false});
  canvas.addEventListener('touchmove',function(e){
    e.preventDefault(); if(!dragging||!ship) return;
    var r=canvas.getBoundingClientRect();
    dragX=(e.touches[0].clientX-r.left)*(cw/r.width);
    dragY=(e.touches[0].clientY-r.top)*(ch/r.height);
    var dx=dragX-ship.x, dy=dragY-ship.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    if(dist>3){
      var power=Math.min(dist*.6,280);
      var ux=dx/dist, uy=dy/dist;
      predictPts=predictPath(ship.vx+ux*power,ship.vy+uy*power,ship.x,ship.y,LEVELS[lvlIdx],200);
    }
  },{passive:false});
  canvas.addEventListener('touchend',function(e){
    e.preventDefault(); if(!dragging) return;
    dragging=false;
    if(ship){
      var dx=dragX-ship.x, dy=dragY-ship.y;
      if(Math.sqrt(dx*dx+dy*dy)>8) doThrust(); else predictPts=[];
    }
  });

  // 键盘
  window.addEventListener('keydown',function(e){
    if(e.key===' '||e.code==='Space'){ e.preventDefault();
      if(flying){ paused=!paused; $('btnPause').classList.toggle('on',paused); }
    }
    if(e.key==='r'||e.key==='R'){ e.preventDefault(); resetLevel(); }
    if(e.key==='ArrowRight'&&lvlIdx<LEVELS.length-1){ e.preventDefault(); lvlIdx++; resetLevel(); }
    if(e.key==='ArrowLeft'&&lvlIdx>0){ e.preventDefault(); lvlIdx--; resetLevel(); }
  });
}

// ============ 自适应画布 ============
function resize(){
  if(!canvas||!canvas.parentElement) return;
  var wrap=canvas.parentElement;
  var w=wrap.clientWidth;
  // 防御: 如果 clientWidth 无效，使用后备值
  if(!w||w<200) w=700;
  w=Math.min(w-4,780);
  var h=Math.min(w*.62,480);
  if(h<200) h=400;
  canvas.width=w; canvas.height=h;
  cw=w; ch=h;
  initStars();
  predictPts=[];
}

// ============ 主循环 ============
var lt=0;
function loop(ts){
  if(lt===0) lt=ts;
  var dt=(ts-lt)/1000; lt=ts;
  if(dt>.1) dt=.1;
  update(dt);
  render(ts);
  requestAnimationFrame(loop);
}

// ============ 初始化 ============
function init(){
  try {
    canvas=$('gc');
    if(!canvas) throw new Error('找不到 Canvas 元素');
    ctx=canvas.getContext('2d');
    if(!ctx) throw new Error('无法获取 Canvas 2D 上下文');

    resize();
    setupInput();
    resetLevel();
    updateUI();
    updatePhys();
    toast('🚀 从飞船拖拽设定推力，松开推进！空格暂停',3500);
    requestAnimationFrame(loop);

    // 处理窗口大小变化
    window.addEventListener('resize',function(){ resize(); });
  } catch(err) {
    // 出错时在页面上显示错误信息
    var body=document.body;
    body.innerHTML='<div style="padding:40px;text-align:center;color:#ff5252;font-family:sans-serif;">'+
      '<h2>⚠️ 游戏初始化失败</h2>'+
      '<p>错误: '+err.message+'</p>'+
      '<p style="color:#888;font-size:13px;">请尝试用 Chrome/Edge/Firefox 打开，或刷新页面重试。</p>'+
      '</div>';
    console.error('引力迷宫初始化失败:',err);
  }
}

// 启动
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',init);
} else {
  init();
}

})();
</script>
</body>
